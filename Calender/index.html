<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カレンダー</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .calendar-wrap {
    width: 100%;
    max-width: 800px;
  }
  iframe {
    display: block;
    width: 100%;
    height: 600px;
    border: 0;
  }
  .add-schedule-btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 20px auto 0;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    color: #ffffff;
    background: #0e002e;
    border: none;
    border-radius: 4px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: background .2s;
  }
  .add-schedule-btn:hover {
    background: #29ae86;
  }
</style>
</head>
<body>
<div class="calendar-wrap">
  <iframe src="https://calendar.google.com/calendar/embed?src=2yarlahotep%40gmail.com&ctz=Asia%2FTokyo&mode=WEEK" frameborder="0" scrolling="no"></iframe>
  <a class="add-schedule-btn" href="booking.html">予定を追加</a>
</div>
</body>
</html>
