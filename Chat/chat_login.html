<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | Rienta Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@500;600;700&display=swap');

:root {
  --bg:        #1a1d21;
  --surface:   #222529;
  --surface2:  #2c2f33;
  --border:    #3f4245;
  --text:      #d1d2d3;
  --text-muted:#888d94;
  --text-on:   #ffffff;
  --accent:    #094067;
  --accent2:   #3da9fc;
  --green:     #3da9fc;
  --green-bg:  #3da9fc;
  --input-bg:  #1a1d21;
  --error:     #e8534a;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 400;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── HEADER ── */
.login-header {
  padding: 24px 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
}
.app-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.app-logo-icon {
  width: 36px; height: 36px;
  background: var(--accent2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.app-logo-name {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-on);
  letter-spacing: .02em;
}

/* ── MAIN ── */
.login-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 48px 44px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 8px 40px rgba(0,0,0,.4);
}

.login-title {
  font-family: 'Outfit', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text-on);
  text-align: center;
  line-height: 1.3;
  margin-bottom: 8px;
}
.login-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.7;
  margin-bottom: 36px;
}
.login-subtitle strong {
  color: var(--text);
  font-weight: 500;
}

/* Workspace badge */
.workspace-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 28px;
}
.workspace-icon {
  width: 36px; height: 36px;
  background: var(--accent2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.workspace-info {}
.workspace-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-on);
  letter-spacing: .02em;
}
.workspace-url {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: .02em;
}

/* Form */
.login-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .04em;
}
.form-input {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 11px 14px;
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text-on);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-input::placeholder { color: var(--text-muted); }
.form-input:focus {
  border-color: #1264a3;
  box-shadow: 0 0 0 3px rgba(18,100,163,.25);
}
.form-input.error { border-color: var(--error); }

.form-error {
  font-size: 12px;
  color: var(--error);
  display: none;
  align-items: center;
  gap: 5px;
}
.form-error.show { display: flex; }

/* Submit */
.submit-btn {
  background: var(--green-bg);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Noto Sans JP', sans-serif;
  letter-spacing: .04em;
  cursor: pointer;
  transition: background .2s, transform .15s;
  margin-top: 4px;
}
.submit-btn:hover { background: var(--green); transform: translateY(-1px); }
.submit-btn:active { transform: translateY(0); }

.form-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0;
}
.form-divider::before, .form-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.form-divider span {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Google SSO style button */
.sso-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 11px;
  font-size: 14px;
  font-weight: 500;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  cursor: pointer;
  transition: background .2s, border-color .2s;
  width: 100%;
}
.sso-btn:hover { background: var(--border); border-color: #555; }
.sso-icon { font-size: 16px; }

.login-footer-note {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 20px;
  line-height: 1.7;
}

/* ── FOOTER ── */
.login-page-footer {
  padding: 20px 40px;
  border-top: 1px solid var(--border);
  text-align: center;
}
.login-page-footer p {
  font-size: 11px;
  color: var(--text-muted);
}

/* ── ANIMATION ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.login-card {
  animation: fadeUp .5s ease forwards;
}

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .login-header { padding: 16px 20px; }
  .login-card { padding: 32px 24px; border-radius: 10px; }
  .login-title { font-size: 22px; }
}
</style>
<link rel="stylesheet" href="/shared/anime-redact.css">
</head>
<body>

<!-- Header -->
<header class="login-header">
  <div class="app-logo">
    <div class="app-logo-icon">💬</div>
    <span class="app-logo-name">Rienta Chat</span>
  </div>
</header>

<!-- Main -->
<main class="login-main">
  <div class="login-card">

    <h1 class="login-title">Rienta Chat に<br>サインイン</h1>
    <p class="login-subtitle">
      <strong>rienta.chat</strong> ワークスペースへようこそ
    </p>

    <!-- Workspace badge -->
    <div class="workspace-badge">
      <div class="workspace-icon">🏢</div>
      <div class="workspace-info">
        <p class="workspace-name">株式会社リエンタ</p>
        <p class="workspace-url">rienta.chat</p>
      </div>
    </div>

    <!-- Form -->
    <form class="login-form" onsubmit="handleLogin(event)">

      <div class="form-group">
        <label class="form-label" for="email">ID</label>
        <input
          class="form-input"
          id="email"
          type="text"
          placeholder="IDを入力"
          autocomplete="username"
        >
        <span class="form-error" id="emailError">
          ⚠ IDを入力してください
        </span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input
          class="form-input"
          id="password"
          type="password"
          placeholder="パスワードを入力"
          autocomplete="current-password"
        >
        <span class="form-error" id="passwordError">
          ⚠ パスワードを入力してください
        </span>
        <span class="form-error" id="loginError" style="margin-top:4px;">
          ⚠ IDまたはパスワードが正しくありません
        </span>
      </div>

      <button class="submit-btn" type="submit">サインイン</button>

      <div class="form-divider"><span>または</span></div>

      <button class="sso-btn" type="button" onclick="handleSSO()">
        <span class="sso-icon">🔑</span>
        SSOでサインイン
      </button>

    </form>

    <p class="login-footer-note">
      このワークスペースは社内メンバー限定です。<br>
      アカウントに関するお問い合わせは管理者までご連絡ください。
    </p>

  </div>
</main>

<!-- Footer -->
<footer class="login-page-footer">
  <p>© 2025 Rienta Chat. All rights reserved.</p>
</footer>

<script>
// SHA-256ハッシュ関数（Web Crypto API）
async function sha256(str) {
  const buf = await crypto.subtle.digest(
    'SHA-256',
    new TextEncoder().encode(str)
  );
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  let valid = true;

  // Reset
  email.classList.remove('error');
  password.classList.remove('error');
  emailError.classList.remove('show');
  passwordError.classList.remove('show');
  const loginError = document.getElementById('loginError');
  if (loginError) loginError.classList.remove('show');

  if (!email.value.trim()) {
    email.classList.add('error');
    emailError.classList.add('show');
    valid = false;
  }
  if (!password.value.trim()) {
    password.classList.add('error');
    passwordError.classList.add('show');
    valid = false;
  }
  if (!valid) return;

  // ハッシュ照合（ソースに平文は残らない）
  const hash = await sha256(email.value.trim() + ':' + password.value.trim());
  if (hash !== '8ed0412563dcade2c0cc4326cd0133c872ddfd4b675a7354eccd5d222be66c3a') {
    password.classList.add('error');
    if (loginError) loginError.classList.add('show');
    return;
  }

  // 簡易ログイン状態を sessionStorage に保存（chat.html の簡易チェック用）
  try { sessionStorage.setItem('rientachat_logged_in', '1'); } catch (e) {}
  window.location.href = 'chat.html';
}

function handleSSO() {
  alert('SSO認証は現在準備中です。');
}
</script>
<script src="/shared/anime-redact.js" defer></script>

</body>
</html>
