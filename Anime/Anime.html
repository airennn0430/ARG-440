<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Incoming Call</title>
<script>
(function () {
  try {
    if (sessionStorage.getItem('anime_instant_call_v1') === '1') {
      document.documentElement.classList.add('anime-instant-call');
    }
  } catch (e) {}
})();
</script>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
━━━━━━━━━━━━━━━━━━━━━━━ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   CALL OVERLAY (fullscreen)
━━━━━━━━━━━━━━━━━━━━━━━ */
#call-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  /* Dark frosted glass background */
  background:
    radial-gradient(ellipse at 30% 20%, rgba(40,40,60,0.95) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(20,20,35,0.98) 0%, transparent 60%),
    #0a0a12;
  padding: env(safe-area-inset-top, 48px) 0 env(safe-area-inset-bottom, 32px);
  opacity: 0;
  transition: opacity 0.4s ease;
}
html.anime-instant-call #call-overlay {
  transition: none !important;
}
#call-overlay.visible { opacity: 1; }
#call-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

/* ── Top section: caller info ── */
.call-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-top: 72px;
  animation: call-fadeIn 0.6s ease 0.3s both;
}

.call-label {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
}

.caller-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.caller-icon svg {
  width: 36px;
  height: 36px;
  fill: none;
  stroke: rgba(255,255,255,0.4);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.caller-name {
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: #fff;
}

.caller-sub {
  font-size: 15px;
  font-weight: 400;
  color: rgba(255,255,255,0.5);
  animation: call-pulse 2s ease-in-out infinite;
}

/* ── Middle: empty space for atmosphere ── */
.call-mid { flex: 1; }

/* ── Bottom section: action buttons ── */
.call-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  padding-bottom: 48px;
  animation: call-fadeIn 0.6s ease 0.5s both;
}

/* Decline / Accept row */
.call-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 72px;
}

.call-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.call-btn-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.call-btn:active .call-btn-circle {
  transform: scale(0.9);
}
.call-btn-circle svg {
  width: 28px;
  height: 28px;
  fill: #fff;
  stroke: none;
}
.call-btn-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.6);
}

/* Decline = red */
.btn-decline .call-btn-circle {
  background: #e8534a;
  box-shadow: 0 4px 24px rgba(232,83,74,0.4);
}
.btn-decline .call-btn-circle svg {
  transform: rotate(135deg);
}

/* Accept = green */
.btn-accept .call-btn-circle {
  background: #34c759;
  box-shadow: 0 4px 24px rgba(52,199,89,0.4);
  animation: call-ring-pulse 1.8s ease-in-out infinite;
}

/* ── Swipe hint (optional iOS-style) ── */
.swipe-hint {
  display: none; /* Hidden by default; shown if we want swipe-to-answer */
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   RING ANIMATION on accept button
━━━━━━━━━━━━━━━━━━━━━━━ */
@keyframes call-ring-pulse {
  0%, 100% { box-shadow: 0 4px 24px rgba(52,199,89,0.4); }
  50%      { box-shadow: 0 4px 40px rgba(52,199,89,0.65), 0 0 0 8px rgba(52,199,89,0.15); }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   CALL CONNECTING TRANSITION
━━━━━━━━━━━━━━━━━━━━━━━ */
#call-overlay.connecting .caller-sub {
  animation: none;
}
#call-overlay.connecting .call-actions {
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
#call-overlay.connecting .call-connecting-text {
  display: block;
}
.call-connecting-text {
  display: none;
  font-size: 15px;
  color: rgba(255,255,255,0.5);
  text-align: center;
  animation: call-pulse 1.5s ease-in-out infinite;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   SHARED KEYFRAMES
━━━━━━━━━━━━━━━━━━━━━━━ */
@keyframes call-fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes call-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   VISUAL NOVEL CONTAINER (hidden initially)
━━━━━━━━━━━━━━━━━━━━━━━ */
#vn-container {
  position: fixed;
  inset: 0;
  z-index: 100001;
  display: none;
  flex-direction: column;
  background: #000;
}
#vn-container.active {
  display: flex;
}

/* VN Canvas — 390×844 base, scales to fit */
.vn-viewport {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

/* Background layer */
.vn-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: background-image 0.5s ease;
}
/* Placeholder gradient when no image */
.vn-bg--default {
  background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
}

/* Character layer */
.vn-character {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  max-height: 85%;
  width: auto;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease, left 0.5s ease;
  pointer-events: none;
}
.vn-character.visible {
  opacity: 1;
}

/* Text box overlay */
.vn-textbox {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 7;
  min-height: clamp(240px, 39vh, 390px);
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.72) 10%, rgba(0,0,0,0.93) 100%);
  padding:
    36px
    max(14px, env(safe-area-inset-left, 14px))
    calc(36px + env(safe-area-inset-bottom, 20px))
    max(14px, env(safe-area-inset-right, 14px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.vn-text {
  font-size: 19px;
  font-weight: 400;
  line-height: 2.05;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.02em;
  min-height: 5.6em;
  padding-inline: 1.1em;
  padding-block-start: 0.45em;
}

/* Tap-to-advance indicator */
.vn-next {
  position: absolute;
  bottom: calc(14px + env(safe-area-inset-bottom, 8px));
  right: 24px;
  font-size: 15px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.08em;
  animation: vn-blink 1.6s ease-in-out infinite;
}
@keyframes vn-blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

/* Text typing effect */
.vn-text span.char {
  opacity: 0;
  display: inline;
}
.vn-text span.char.visible {
  opacity: 1;
}

/* ルビ：親文字は span.char、rt は別管理。同時刻に .visible を付けて文字送りと同期 */
.vn-text ruby.vn-ruby-unit {
  display: ruby;
  ruby-position: over;
  ruby-align: center;
  -webkit-ruby-position: before;
  vertical-align: baseline;
}
.vn-text ruby.vn-ruby-unit > span.char {
  opacity: 0;
  display: inline;
}
.vn-text ruby.vn-ruby-unit > span.char.visible {
  opacity: 1;
}
.vn-text ruby.vn-ruby-unit > rt.vn-ruby-rt {
  opacity: 0;
  visibility: hidden;
  font-size: 0.55em;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  color: rgba(255,255,255,0.78);
  white-space: nowrap;
}
.vn-text ruby.vn-ruby-unit > rt.vn-ruby-rt.visible {
  opacity: 1;
  visibility: visible;
}

/* Branch choices — 立ち絵・背景エリアの中央（下はセリフ枠分あける） */
.vn-choices-layer {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: clamp(210px, 33vh, 315px);
  z-index: 6;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 24px;
  pointer-events: none;
}
.vn-choices-layer.active {
  display: flex;
  gap: 14px;
  pointer-events: auto;
}
.vn-choice-btn {
  width: min(100%, 360px);
  max-width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 19px;
  line-height: 1.55;
  font-weight: 500;
  color: rgba(255,255,255,0.96);
  padding: 18px 20px;
  border-radius: 14px;
  border: 1px solid rgba(232,83,74,0.5);
  background: rgba(12,12,22,0.82);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.vn-choice-btn:active {
  background: rgba(232,83,74,0.22);
  border-color: rgba(232,83,74,0.85);
}

/* VN fade to black */
.vn-fade {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  z-index: 10;
}
.vn-fade.active {
  opacity: 1;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   CALL END SCREEN
━━━━━━━━━━━━━━━━━━━━━━━ */
#call-end {
  position: fixed;
  inset: 0;
  z-index: 100002;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(40,40,60,0.95) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(20,20,35,0.98) 0%, transparent 60%),
    #0a0a12;
  padding: env(safe-area-inset-top, 48px) 0 env(safe-area-inset-bottom, 32px);
  opacity: 0;
  transition: opacity 0.4s ease;
}
#call-end.active {
  display: flex;
  opacity: 1;
}

.call-end-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-top: 96px;
  animation: call-fadeIn 0.5s ease both;
}
.call-end-name {
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: #fff;
}
.call-end-duration {
  font-size: 16px;
  font-weight: 400;
  color: rgba(255,255,255,0.45);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
}

.call-end-mid { flex: 1; }

.call-end-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 64px;
  animation: call-fadeIn 0.5s ease 0.2s both;
}

/* End button = red, rotated phone icon */
.btn-end .call-btn-circle {
  background: #e8534a;
  box-shadow: 0 4px 24px rgba(232,83,74,0.4);
}
.btn-end .call-btn-circle svg {
  transform: rotate(135deg);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   DESKTOP BLOCK MESSAGE
━━━━━━━━━━━━━━━━━━━━━━━ */
#desktop-block {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #0a0a12;
  color: rgba(255,255,255,0.4);
  font-size: 14px;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  line-height: 1.8;
}

/* Show on wide screens */
@media (min-width: 769px) {
  #desktop-block { display: flex; }
  #call-overlay, #vn-container, #call-end { display: none !important; }
}
</style>
</head>
<body>

<!-- Desktop blocker -->
<div id="desktop-block">
  このページはスマートフォンでのみ閲覧できます。
</div>

<!-- ═══ INCOMING CALL OVERLAY ═══ -->
<div id="call-overlay">

  <div class="call-top">
    <span class="call-label">着信</span>
    <div class="caller-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/>
      </svg>
    </div>
    <span class="caller-name">非通知</span>
    <span class="caller-sub" id="callSub">着信中...</span>
  </div>

  <div class="call-mid"></div>

  <div class="call-bottom">
    <div class="call-actions" id="callActions">
      <!-- Decline -->
      <button class="call-btn btn-decline" id="btnDecline" aria-label="拒否">
        <div class="call-btn-circle">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.91 15.91 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.72 11.72 0 0 0 3.58.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <span class="call-btn-label">拒否</span>
      </button>
      <!-- Accept -->
      <button class="call-btn btn-accept" id="btnAccept" aria-label="応答">
        <div class="call-btn-circle">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.91 15.91 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.72 11.72 0 0 0 3.58.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <span class="call-btn-label">応答</span>
      </button>
    </div>
    <p class="call-connecting-text" id="connectingText">接続中...</p>
  </div>

</div>

<!-- ═══ VISUAL NOVEL CONTAINER ═══ -->
<div id="vn-container">
  <div class="vn-viewport">
    <div class="vn-bg vn-bg--default" id="vnBg"></div>
    <img class="vn-character" id="vnChar" src="" alt="">
    <div class="vn-choices-layer" id="vnChoices" aria-live="polite"></div>
    <div class="vn-textbox" id="vnTextbox">
      <div class="vn-text" id="vnText"></div>
      <div class="vn-next" id="vnNext">TAP ▸</div>
    </div>
    <div class="vn-fade" id="vnFade"></div>
  </div>
</div>

<!-- ═══ CALL END SCREEN ═══ -->
<div id="call-end">
  <div class="call-end-top">
    <div class="caller-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/>
      </svg>
    </div>
    <span class="call-end-name">非通知</span>
    <span class="call-end-duration" id="callEndDuration">0:00</span>
  </div>
  <div class="call-end-mid"></div>
  <div class="call-end-bottom">
    <button class="call-btn btn-end" id="btnEnd" aria-label="通話終了">
      <div class="call-btn-circle">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.91 15.91 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.72 11.72 0 0 0 3.58.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
      </div>
      <span class="call-btn-label">通話終了</span>
    </button>
  </div>
</div>

<script src="sfx.js"></script>
<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CONFIG — トリガー日時・シナリオをここで管理
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const CALL_CONFIG = {
  // ── トリガー条件 ──
  // null = 常時発火（テスト用）。本番では Date 文字列を設定
  // 例: triggerAfter: '2025-07-01T00:00:00+09:00'
  //     triggerBefore: '2025-07-08T23:59:59+09:00'
  triggerAfter:  null,
  triggerBefore: null,

  // ── 着信後の接続演出時間 (ms) ──
  connectDelay: 1000,

  // ── バイブレーション パターン (ms) [vibrate, pause, ...] ──
  vibratePattern: [300, 200, 300, 200, 300, 600],
  vibrateRepeat: true,
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   VN SCENARIO — シナリオデータ仕様書
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  各ステップは以下のプロパティを持つオブジェクト。
  すべて省略可能（省略時は前のステップの値を維持）。

  ┌─────────────┬────────────────────────────────────────────┐
  │ プロパティ    │ 説明                                       │
  ├─────────────┼────────────────────────────────────────────┤
  │ text         │ 本文。<br> または / で改行可。                │
  │              │ <ruby>漢字<rt>ルビ</rt></ruby> 可              │
  │ bg           │ 背景画像URL。変更時のみ指定。               │
  │ char         │ キャラ立ち絵URL。変更時のみ指定。           │
  │ charVisible  │ true/false — 立ち絵の表示/非表示            │
  │ charPos      │ 'left'|'center'|'right' — 立ち絵の位置     │
  │ fade         │ 'in'  — 暗転から明転して表示                │
  │              │ 'out' — 明転から暗転して表示                │
  │ bgm          │ BGM制御:                                    │
  │              │   { src: 'path/to/file.mp3' } — 再生開始    │
  │              │   { src: 'path/to/file.mp3',                │
  │              │     volume: 0.5, loop: true } — オプション  │
  │              │   'stop'  — 停止                             │
  │              │   'fadeout' — フェードアウト停止(2s)         │
  │ textSpeed    │ タイピング速度(ms/文字)。省略時 = 45        │
  │ wait         │ 自動で次へ進むまでの待機(ms)。省略=タップ待ち│
  │ choices      │ [{ text: '…' }, …] — 選択肢（TAP不可）       │
  └─────────────┴────────────────────────────────────────────┘

  ── 使用例 ──────────────────────────────────────────── */

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TRIGGER CHECK — 日時 & localStorage ゲート
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function shouldTriggerCall() {
  // Desktop check
  if (window.innerWidth >= 769) return false;

  // Domain gate — production only
  if (window.location.hostname !== 'hidarling.vercel.app') return false;

  // Date gate
  const now = new Date();
  if (CALL_CONFIG.triggerAfter && now < new Date(CALL_CONFIG.triggerAfter)) return false;
  if (CALL_CONFIG.triggerBefore && now > new Date(CALL_CONFIG.triggerBefore)) return false;

  return true;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   VIBRATION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let vibrateTimer = null;

function startVibration() {
  if (!navigator.vibrate) return;
  const pattern = CALL_CONFIG.vibratePattern;
  navigator.vibrate(pattern);

  if (CALL_CONFIG.vibrateRepeat) {
    const cycleDuration = pattern.reduce((a, b) => a + b, 0);
    vibrateTimer = setInterval(() => {
      navigator.vibrate(pattern);
    }, cycleDuration);
  }
}

function stopVibration() {
  if (vibrateTimer) { clearInterval(vibrateTimer); vibrateTimer = null; }
  if (navigator.vibrate) navigator.vibrate(0);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CALL SCREEN LOGIC
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const overlay   = document.getElementById('call-overlay');
const btnAccept = document.getElementById('btnAccept');
const btnDecline = document.getElementById('btnDecline');
const callSub   = document.getElementById('callSub');
const connectingText = document.getElementById('connectingText');

function showCallScreen() {
  overlay.classList.add('visible');
  startVibration();
  let soundOff = false;
  try {
    soundOff = sessionStorage.getItem('toravolta_sound_pref_v1') === '0';
  } catch (e) {}
  if (!soundOff && window.AnimeSFX) AnimeSFX.startRingtone();
}

function dismissCall() {
  stopVibration();
  if (window.AnimeSFX) AnimeSFX.stopRingtone();
  overlay.classList.add('hidden');

  // 3秒後に再着信
  setTimeout(() => {
    overlay.classList.remove('hidden', 'connecting');
    callSub.textContent = '着信中...';
    showCallScreen();
  }, 3000);
}

function acceptCall() {
  stopVibration();
  if (window.AnimeSFX) AnimeSFX.stopRingtone();
  callStartTime = Date.now();

  // Transition to "connecting" state
  overlay.classList.add('connecting');
  callSub.textContent = '接続中...';

  setTimeout(() => {
    overlay.classList.add('hidden');
    startVN();
  }, CALL_CONFIG.connectDelay);
}

btnAccept.addEventListener('click', acceptCall);
btnDecline.addEventListener('click', dismissCall);

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BGM CONTROLLER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let bgmAudio = null;
let bgmFadeTimer = null;

function bgmPlay(opts) {
  bgmStop();
  bgmAudio = new Audio(opts.src);
  bgmAudio.loop = opts.loop !== undefined ? opts.loop : true;
  bgmAudio.volume = opts.volume !== undefined ? opts.volume : 0.5;
  bgmAudio.play().catch(() => {
    // iOS autoplay restriction — retry on next tap
    const retry = () => {
      bgmAudio.play().catch(() => {});
      document.removeEventListener('touchstart', retry);
      document.removeEventListener('click', retry);
    };
    document.addEventListener('touchstart', retry, { once: true });
    document.addEventListener('click', retry, { once: true });
  });
}

function bgmStop() {
  if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
  if (bgmAudio) {
    bgmAudio.pause();
    bgmAudio.currentTime = 0;
    bgmAudio = null;
  }
}

function bgmFadeout(duration) {
  if (!bgmAudio) return;
  const dur = duration || 2000;
  const step = 50;
  const decrement = (bgmAudio.volume / (dur / step));
  bgmFadeTimer = setInterval(() => {
    if (!bgmAudio) { clearInterval(bgmFadeTimer); return; }
    bgmAudio.volume = Math.max(0, bgmAudio.volume - decrement);
    if (bgmAudio.volume <= 0) {
      clearInterval(bgmFadeTimer);
      bgmFadeTimer = null;
      bgmStop();
    }
  }, step);
}

function handleBGM(bgm) {
  if (!bgm) return;
  if (bgm === 'stop') { bgmStop(); return; }
  if (bgm === 'fadeout') { bgmFadeout(); return; }
  if (typeof bgm === 'object' && bgm.src) { bgmPlay(bgm); return; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   VISUAL NOVEL ENGINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const vnContainer = document.getElementById('vn-container');
const vnBg        = document.getElementById('vnBg');
const vnChar      = document.getElementById('vnChar');
const vnText      = document.getElementById('vnText');
const vnNext      = document.getElementById('vnNext');
const vnChoices   = document.getElementById('vnChoices');
const vnFade      = document.getElementById('vnFade');

let vnIndex = 0;
let vnTyping = false;
let vnCharTimers = [];
let vnWaitTimer = null;
let vnLocked = false; // fade演出中のタップ抑制

function startVN() {
  vnContainer.classList.add('active');
  vnIndex = 0;
  vnLocked = false;
  renderVNStep();
}

function renderVNStep() {
  if (vnIndex >= VN_SCENARIO.length) {
    endVN();
    return;
  }

  const step = VN_SCENARIO[vnIndex];

  // BGM
  handleBGM(step.bgm);

  // Fade control
  if (step.fade === 'in') {
    vnLocked = true;
    vnFade.classList.add('active');
    requestAnimationFrame(() => {
      applyVNContent(step);
      setTimeout(() => {
        vnFade.classList.remove('active');
        setTimeout(() => { vnLocked = false; }, 400);
      }, 100);
    });
  } else if (step.fade === 'out') {
    vnLocked = true;
    vnFade.classList.add('active');
    setTimeout(() => {
      applyVNContent(step);
      requestAnimationFrame(() => {
        vnFade.classList.remove('active');
        setTimeout(() => { vnLocked = false; }, 800);
      });
    }, 800);
  } else {
    applyVNContent(step);
  }
}

function normalizeVnText(s) {
  // 「/」は改行にするが、</rt>・</ruby> など閉じタグ内の / は壊さない（そうしないと <ruby> が全文表示される）
  return String(s || '').replace(/(?<!<)\//g, '<br>');
}

function applyVNContent(step) {
  vnChoices.classList.remove('active');
  vnChoices.innerHTML = '';

  // Background
  if (step.bg) {
    vnBg.classList.remove('vn-bg--default');
    vnBg.style.backgroundImage = `url('${step.bg}')`;
  }

  // Character image
  if (step.char !== undefined) {
    vnChar.src = step.char;
  }
  if (step.charVisible !== undefined) {
    vnChar.classList.toggle('visible', step.charVisible);
  }

  // Character position
  if (step.charPos) {
    vnChar.style.left =
      step.charPos === 'left'  ? '25%' :
      step.charPos === 'right' ? '75%' : '50%';
  }

  if (step.choices && step.choices.length) {
    vnCharTimers.forEach(t => clearTimeout(t));
    vnCharTimers = [];
    if (vnWaitTimer) { clearTimeout(vnWaitTimer); vnWaitTimer = null; }
    vnText.innerHTML = '';
    vnTyping = false;
    vnNext.style.display = 'none';
    step.choices.forEach((ch) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'vn-choice-btn';
      btn.textContent = ch.text;
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (window.AnimeSFX) AnimeSFX.playClick();
        vnChoices.classList.remove('active');
        vnChoices.innerHTML = '';
        vnIndex++;
        renderVNStep();
      });
      vnChoices.appendChild(btn);
    });
    vnChoices.classList.add('active');
    return;
  }

  // Text — typing effect（/ は改行に変換）
  const speed = step.textSpeed || 45;
  typeText(normalizeVnText(step.text || ''), speed, () => {
    // Auto-advance if wait is specified
    if (step.wait !== undefined && step.wait >= 0) {
      vnNext.style.display = 'none';
      vnWaitTimer = setTimeout(() => {
        vnWaitTimer = null;
        vnIndex++;
        renderVNStep();
      }, step.wait);
    }
  });
}

function typeText(text, speed, onComplete) {
  // Clear previous
  vnCharTimers.forEach(t => clearTimeout(t));
  vnCharTimers = [];
  if (vnWaitTimer) { clearTimeout(vnWaitTimer); vnWaitTimer = null; }
  vnText.innerHTML = '';
  vnNext.style.display = 'none';
  vnTyping = true;

  // Build char spans（<br>・<ruby>…<rt>…</rt></ruby> を単位として保持）
  const chars = [];
  let i = 0;
  while (i < text.length) {
    if (text.substr(i, 4) === '<br>' || text.substr(i, 5) === '<br/>') {
      const brLen = text[i + 3] === '>' ? 4 : 5;
      chars.push({ type: 'br', raw: text.substr(i, brLen) });
      i += brLen;
    } else if (text.substr(i, 6) === '<ruby>') {
      const close = text.indexOf('</ruby>', i);
      if (close === -1) {
        chars.push({ type: 'char', raw: text[i] });
        i++;
        continue;
      }
      const inner = text.slice(i + 6, close);
      const rtOpen = inner.indexOf('<rt>');
      const rtEnd = inner.indexOf('</rt>');
      if (rtOpen === -1 || rtEnd === -1 || rtEnd < rtOpen) {
        chars.push({ type: 'char', raw: text[i] });
        i++;
        continue;
      }
      chars.push({
        type: 'ruby',
        base: inner.slice(0, rtOpen),
        rt: inner.slice(rtOpen + 4, rtEnd),
      });
      i = close + 7;
    } else {
      chars.push({ type: 'char', raw: text[i] });
      i++;
    }
  }

  // Render
  const fragment = document.createDocumentFragment();
  const charEls = [];
  chars.forEach(c => {
    if (c.type === 'br') {
      fragment.appendChild(document.createElement('br'));
    } else if (c.type === 'ruby') {
      const ruby = document.createElement('ruby');
      ruby.className = 'vn-ruby-unit';
      const baseSpans = [];
      for (let j = 0; j < c.base.length; j++) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = c.base[j];
        ruby.appendChild(span);
        baseSpans.push(span);
      }
      const rtEl = document.createElement('rt');
      rtEl.className = 'vn-ruby-rt';
      rtEl.textContent = c.rt;
      ruby.appendChild(rtEl);
      fragment.appendChild(ruby);
      charEls.push({ _rubyBatch: true, baseSpans, rtEl });
    } else {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = c.raw;
      fragment.appendChild(span);
      charEls.push(span);
    }
  });
  vnText.appendChild(fragment);

  // Reveal one by one（ルビは親字と rt を同一タイミングで表示）
  charEls.forEach((el, idx) => {
    const t = setTimeout(() => {
      if (el && el._rubyBatch) {
        el.baseSpans.forEach((s) => s.classList.add('visible'));
        el.rtEl.classList.add('visible');
      } else if (el) {
        el.classList.add('visible');
      }
      if (idx === charEls.length - 1) {
        vnTyping = false;
        vnNext.style.display = '';
        if (onComplete) onComplete();
      }
    }, speed * idx);
    vnCharTimers.push(t);
  });

  // Handle empty text edge case
  if (charEls.length === 0) {
    vnTyping = false;
    vnNext.style.display = '';
    if (onComplete) onComplete();
  }
}

function skipTyping() {
  vnCharTimers.forEach(t => clearTimeout(t));
  vnCharTimers = [];
  vnText.querySelectorAll('.char, .vn-ruby-rt').forEach(el => el.classList.add('visible'));
  vnTyping = false;
  vnNext.style.display = '';
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CALL DURATION TIMER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let callStartTime = null;

function getCallDuration() {
  if (!callStartTime) return '0:00';
  const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  return m + ':' + String(s).padStart(2, '0');
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CALL END SCREEN
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const callEndScreen   = document.getElementById('call-end');
const callEndDuration = document.getElementById('callEndDuration');
const btnEnd          = document.getElementById('btnEnd');

function endVN() {
  bgmFadeout(1500);
  if (window.AnimeSFX) AnimeSFX.stopCalling();
  vnFade.classList.remove('active');
  showCallEndScreen();
  vnContainer.classList.remove('active');
  bgmStop();
}

function showCallEndScreen() {
  // Set duration
  callEndDuration.textContent = getCallDuration();
  callEndScreen.classList.add('active');
  if (window.AnimeSFX) AnimeSFX.playBusyTone();
  try {
    localStorage.setItem('anime_call_end_reached_v1', '1');
  } catch (e) {}
}

btnEnd.addEventListener('click', () => {
  // Try to close the window/tab
  window.close();
  // Fallback: if window.close() is blocked (not opened by script),
  // navigate to blank or show a "closed" state
  setTimeout(() => {
    document.body.innerHTML = '';
    document.body.style.background = '#000';
  }, 300);
});

// Tap handler for VN
vnContainer.addEventListener('click', (e) => {
  if (e.target.closest('button, a')) return;
  if (vnLocked) return;
  if (vnChoices.classList.contains('active')) return;

  // Cancel wait timer if active
  if (vnWaitTimer) {
    clearTimeout(vnWaitTimer);
    vnWaitTimer = null;
    vnIndex++;
    if (window.AnimeSFX) AnimeSFX.playClick();
    renderVNStep();
    return;
  }

  if (vnTyping) {
    skipTyping();
    if (window.AnimeSFX) AnimeSFX.playClick();
  } else {
    vnIndex++;
    if (window.AnimeSFX) AnimeSFX.playClick();
    renderVNStep();
  }
});

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   INIT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
document.addEventListener('DOMContentLoaded', () => {
  if (!shouldTriggerCall()) return;
  let instant = false;
  try {
    instant = sessionStorage.getItem('anime_instant_call_v1') === '1';
    if (instant) sessionStorage.removeItem('anime_instant_call_v1');
  } catch (e) {}
  if (instant) {
    showCallScreen();
    document.documentElement.classList.remove('anime-instant-call');
    return;
  }
  setTimeout(showCallScreen, 800);
});

/* ── DEBUG: テスト用 — コンソールから手動発火 ──
   resetCall()  → seenフラグリセット＆再表示
   testVN()     → VNパートのみテスト
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
window.resetCall = function() {
  bgmStop();
  if (window.AnimeSFX) AnimeSFX.stopAllLoops();
  overlay.classList.remove('hidden', 'connecting', 'visible');
  vnContainer.classList.remove('active');
  vnFade.classList.remove('active');
  vnChoices.classList.remove('active');
  vnChoices.innerHTML = '';
  setTimeout(showCallScreen, 300);
};

window.testVN = function() {
  bgmStop();
  if (window.AnimeSFX) AnimeSFX.stopRingtone();
  overlay.classList.add('hidden');
  startVN();
};
</script>
