<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネクロゲーム_最新版 | TELLASTRY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap');

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   CSS Variables
━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root{
  --tl-teal:       #7fc9b5;
  --tl-teal-deep:  #5aa48f;
  --tl-ink:        #2f3b38;
  --tl-ink-soft:   #5c6b67;
  --tl-ink-dim:    #8b9793;
  --tl-bg:         #f4f2ec;
  --tl-canvas:     #e3efe9;
  --tl-paper:      #fdfbf5;
  --tl-line:       rgba(47,59,56,.18);
  --tl-red:        #d24545;
  --tl-cmt-bg:     rgba(255,205,90,.32);
  --tl-cmt-bg-hi:  rgba(255,186,52,.62);
  --tl-cmt-line:   rgba(178,126,10,.8);
  --radius-sm:     4px;
  --radius-md:     8px;

  --fs:      15px;
  --col-w:   calc(var(--fs) * 2);
  --badge-h: 30px;

  --hdr-h:      56px;
  --canvas-pad: 34px;
  --caption-h:  32px;
  --paper-pad:  30px;

  --page-h: clamp(280px,
    calc(100dvh - var(--hdr-h)
         - var(--canvas-pad) - var(--caption-h) - var(--paper-pad) - var(--badge-h)),
    720px);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Reset & Base
━━━━━━━━━━━━━━━━━━━━━━━━━ */
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--tl-bg);
  color:var(--tl-ink);
  font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
  line-height:1.6;
}
button{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.tl-header{
  position:sticky; top:0; z-index:100;
  height:var(--hdr-h);
  background:var(--tl-teal);
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  padding:0 20px;
  box-shadow:0 1px 0 rgba(0,0,0,.06);
}
.tl-header-title{
  display:flex; align-items:center; gap:6px;
  min-width:0; flex:1 1 auto;
}
.tl-header-title h1{
  min-width:0;
  font-size:15px; font-weight:600;
  color:#1f332c;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tl-header-right{
  display:flex; align-items:center; gap:14px;
  flex-shrink:0;
}
.tl-header-btn{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px;
  background:transparent; border:none; border-radius:var(--radius-sm);
  color:#25423a;
  cursor:pointer;
  transition:background .15s;
}
.tl-header-btn:hover{ background:rgba(255,255,255,.28); }
.tl-userchip{
  display:flex; align-items:center; gap:8px;
  color:#25423a; font-size:13px; font-weight:500;
  cursor:default;
}
.tl-userchip svg{ opacity:.8; flex-shrink:0; }
.tl-userchip .caret{ opacity:.7; }

.tl-edit-btn{
  flex-shrink:0;
  width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; color:#1f332c;
  opacity:.7;
  cursor:default;
}

/* Popover (history) */
.tl-pop-anchor{ position:relative; }
.tl-pop{
  position:absolute; top:calc(100% + 8px); right:0;
  width:260px; max-width:80vw;
  background:#fff; color:var(--tl-ink);
  border:1px solid var(--tl-line); border-radius:var(--radius-md);
  box-shadow:0 8px 28px rgba(20,40,35,.16);
  padding:14px;
  font-size:12.5px; line-height:1.8;
  z-index:120;
}
.tl-pop[hidden]{ display:none; }
.tl-pop h4{ font-size:12px; font-weight:700; margin-bottom:8px; color:var(--tl-teal-deep); }
.tl-hist-list{ display:flex; flex-direction:column; gap:2px; }
.tl-hist-item{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  width:100%; text-align:left;
  background:transparent; border:none; border-radius:var(--radius-sm);
  padding:8px 10px; cursor:pointer;
}
.tl-hist-item:hover{ background:rgba(47,59,56,.06); }
.tl-hist-item[aria-current="true"]{ background:rgba(127,201,181,.18); }
.tl-hist-row1{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
.tl-hist-dot{ width:6px; height:6px; border-radius:50%; background:var(--tl-teal-deep); flex-shrink:0; }
.tl-hist-item[aria-current="true"] .tl-hist-row1::after{ content:'現在表示中'; margin-left:auto; font-size:10px; font-weight:500; color:var(--tl-teal-deep); }
.tl-hist-meta{ font-size:11px; color:var(--tl-ink-dim); padding-left:12px; }
.tl-hist-glitch{
  display:inline-block;
  animation:tlGlitch 4.5s infinite steps(1, end);
}
@keyframes tlGlitch{
  0%, 91%, 100%{ transform:translate(0,0); text-shadow:none; opacity:1; }
  92%{ transform:translate(-2px,1px); text-shadow:-2px 0 #ff3b6b, 2px 0 #33d6ff; opacity:.85; }
  93%{ transform:translate(2px,-1px); text-shadow:2px 0 #33d6ff, -2px 0 #ff3b6b; }
  94%{ transform:translate(0,0); text-shadow:none; opacity:1; }
  95%{ transform:translate(-1px,-1px); text-shadow:1px 0 #ff3b6b, -1px 0 #33d6ff; opacity:.85; }
  96%{ transform:translate(1px,1px); text-shadow:-1px 0 #33d6ff, 1px 0 #ff3b6b; }
  97%, 99%{ transform:translate(0,0); text-shadow:none; opacity:1; }
  98%{ transform:translate(1px,0); text-shadow:-2px 0 #ff3b6b, 2px 0 #33d6ff; opacity:.85; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Script canvas
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.canvas{
  flex:1 1 auto; min-height:0;
  overflow-x:auto; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  touch-action:pan-x pan-y;
  background:var(--tl-canvas);
  padding:calc(var(--canvas-pad) / 2) 20px;
  display:flex; flex-direction:column;
}
.canvas::-webkit-scrollbar{ height:10px; }
.canvas::-webkit-scrollbar-track{ background:transparent; }
.canvas::-webkit-scrollbar-thumb{ background:rgba(47,59,56,.25); border-radius:5px; }

.page{
  width:max-content; min-width:100%;
  margin:auto 0;
}
.spread{
  display:flex; flex-direction:row; flex-wrap:nowrap;
  align-items:flex-start; justify-content:center;
  gap:26px;
}
.panel{
  flex:0 0 auto;
  background:var(--tl-paper);
  border-radius:2px;
  padding:14px 18px 16px;
  box-shadow:0 2px 10px rgba(20,60,50,.10), 0 0 0 1px rgba(20,60,50,.05);
}
.panel__cuts{
  display:flex; flex-direction:row; flex-wrap:nowrap; align-items:stretch;
  width:max-content;
  justify-content:flex-end;
  background-repeat:no-repeat, no-repeat;
  background-position:right bottom, right bottom;
  background-image:
    linear-gradient(to bottom, var(--tl-line) 0 1px, transparent 1px),
    repeating-linear-gradient(to left, var(--tl-line) 0 1px, transparent 1px var(--col-w));
  background-size:
    100% calc(var(--page-h) + 1px),
    100% var(--page-h);
  min-width:calc(var(--col-w) * 6);
}

.cut{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; }
.cut__badge-slot{
  height:var(--badge-h);
  display:flex; align-items:flex-start; justify-content:flex-end;
  padding-top:2px;
}
.cut__badge{
  width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--tl-ink-dim);
  border-radius:2px;
  font-family:'Outfit', sans-serif;
  font-size:12px; font-weight:600;
  color:var(--tl-ink-soft);
  background:var(--tl-paper);
}
.cut__body{
  writing-mode:vertical-rl; -webkit-writing-mode:vertical-rl;
  text-orientation:mixed; -webkit-text-orientation:mixed;
  height:var(--page-h);
  box-sizing:border-box;
  padding:10px 0 6px;
  font-size:var(--fs);
  line-height:var(--col-w);
  letter-spacing:.02em;
  color:var(--tl-ink);
  line-break:strict;
  word-break:normal;
  overflow-wrap:normal;
}
.cut__body > p{ margin:0; }
.tcu{ text-combine-upright:all; }

.s-hashira{ font-weight:600; }
.s-tokagaki{ padding-inline-start:var(--col-w); color:var(--tl-ink-soft); }
.s-name{ font-weight:500; }
.s-line{ padding-inline-start:var(--col-w); }
.s-line-cont{ padding-inline-start:var(--col-w); }
.s-gap{ color:transparent; }
.s-glitch{ display:inline-block; animation:tlGlitch 4.5s infinite steps(1, end); }
.s-delete-line{
  writing-mode:horizontal-tb;
  display:flex; align-items:center; justify-content:center;
}
.s-delete-btn{
  writing-mode:horizontal-tb;
  width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid var(--tl-ink-dim); border-radius:4px;
  color:var(--tl-red);
  cursor:pointer;
  opacity:.75;
  transition:opacity .15s, background .15s;
}
.s-delete-btn:hover{ opacity:1; background:rgba(210,69,69,.08); }

.s-cover-title{ font-weight:700; letter-spacing:.06em; }
.s-cover-sub{ padding-inline-start:.4em; color:var(--tl-ink-soft); }
.s-cover-date{ padding-inline-start:.4em; color:var(--tl-ink-dim); font-size:calc(var(--fs) * .92); }
.s-cover-author{ padding-inline-start:.4em; color:var(--tl-ink-dim); font-size:calc(var(--fs) * .92); }
.tcy{ text-combine-upright:all; -webkit-text-combine:horizontal; }

.page-caption{
  writing-mode:horizontal-tb;
  text-align:center;
  font-family:'Outfit', sans-serif;
  font-size:12px; letter-spacing:.12em;
  color:var(--tl-ink-dim);
  padding:calc(var(--caption-h) / 2) 0;
}

/* Comment marker */
.cmt{
  background-color:var(--tl-cmt-bg);
  text-decoration:underline dotted 1px;
  text-decoration-color:var(--tl-cmt-line);
  text-underline-offset:3px;
  border-radius:2px;
  cursor:help;
}
.cmt:hover, .cmt:focus-visible, .cmt.is-open{
  background-color:var(--tl-cmt-bg-hi);
  outline:none;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Comment tooltip (fixed, outside canvas)
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.cmt-tip{
  position:fixed; z-index:200;
  writing-mode:horizontal-tb;
  width:230px; max-width:70vw;
  background:#2f3b38; color:#f2f6f4;
  border-radius:var(--radius-md);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  padding:10px 12px;
  font-size:12px; line-height:1.7;
  visibility:hidden;
}
.cmt-tip[hidden]{ display:none; }
.cmt-tip .tip-item + .tip-item{ margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.14); }
.cmt-tip .tip-head{ display:flex; align-items:baseline; gap:6px; margin-bottom:4px; }
.cmt-tip .tip-author{ font-weight:700; font-size:12px; color:#bfe6da; }
.cmt-tip .tip-time{ font-size:10px; color:#93a39d; }
.cmt-tip .tip-text{ color:#eef3f1; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Delete-script confirmation modal
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.tl-modal{
  position:fixed; inset:0; z-index:300;
  writing-mode:horizontal-tb;
  display:flex; align-items:center; justify-content:center;
  background:rgba(20,30,27,.45);
  padding:20px;
}
.tl-modal[hidden]{ display:none; }
.tl-modal-box{
  background:var(--tl-paper); color:var(--tl-ink);
  border-radius:var(--radius-md);
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  padding:22px 24px;
  width:280px; max-width:100%;
  text-align:center;
}
.tl-modal-text{ font-size:14px; line-height:1.7; margin-bottom:16px; }
.tl-modal-yes{
  background:var(--tl-red); color:#fff; border:none; border-radius:20px;
  padding:8px 28px; font-size:13px; font-weight:600; cursor:pointer;
}
.tl-modal-yes:hover{ opacity:.9; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   RESPONSIVE — chrome only, never the tategaki structure
━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media (max-width:720px){
  :root{
    --hdr-h:50px;
    --canvas-pad:24px; --caption-h:26px; --paper-pad:22px;
  }
  .tl-header{ padding:0 12px; gap:8px; }
  .tl-header-title h1{ font-size:12.5px; }
  .tl-header-right{ gap:6px; }
  .tl-userchip .tl-username{ display:none; }
  .tl-header-btn{ width:32px; height:32px; }
  .spread{ gap:16px; }
  .panel{ padding:10px 12px 14px; }
}
</style>
<link rel="stylesheet" href="../shared/anime-redact.css">
</head>
<body>

<!-- ═══ HEADER ═══ -->

<template id="rev-necrogame-v1" data-label="最新版" data-date="2026/9/2" data-author="獅子王千暁" data-note="最新台本" data-current="1">
  <section data-panel data-min-cols="9">

      <p class="s-name">伏見 瀬人</p>

      <p class="s-tokagaki"><span class="cmt" data-cmt="c1" tabindex="0" role="button" aria-haspopup="true">(伏見、朝倉と兵頭の間に割って入る)</span></p>
      <p class="s-gap">　</p>
      <p class="s-name">朝倉 陽介</p>
      <p class="s-line">邪魔するな！だいたい、全部お前のせいで…！</p>
      <p class="s-gap">　</p>
      <p class="s-name">伏見 瀬人</p>
      <p class="s-line">邪魔ァ？お前の方が進行の邪魔なンだよ。オレの楽しみを奪うなよな。</p>
      <p class="s-gap">　</p>
      <p class="s-name">朝倉 陽介</p>
      <p class="s-line">人が死んでるんだぞ！何だよその態度！</p>
      <p class="s-gap">　</p>
      <p class="s-name">伏見 瀬人</p>
      <p class="s-line">じゃ、葬式の用意をしないとなァ。</p>
      <p class="s-line-cont"><span class="cmt" data-cmt="c2" tabindex="0" role="button" aria-haspopup="true">…待てよ？棺桶の用意が無ェ。</span>やっぱ葬式は無しだ。</p>
      <p class="s-gap">　</p>
      <p class="s-name">兵頭 誠</p>
      <p class="s-line">伏見！あんま調子に乗ってると……</p>
      <p class="s-tokagaki">（兵頭、伏見に掴みかかるものの、伏見はそのままマイクを持って発言位置へ。）</p>
      <p class="s-gap">　</p>
      <p class="s-name">伏見 瀬人</p>

      <p class="s-line">はーい！　もちろん持ってるよォ！</p>
      <p class="s-gap">　</p>
      <p class="s-name">朝倉 陽介</p>
      <p class="s-line">……誰だ？</p>
      <p class="s-tokagaki"><span class="cmt" data-cmt="c3" tabindex="0" role="button" aria-haspopup="true">（正面の大型モニターが点灯する。）</span></p>
      <p class="s-gap">　</p>
      <p class="s-name">ノンノン</p>
      <p class="s-line">お待たせしましたぁ！ゲームの説明なら、このボクにお任せ！</p>

      <p class="s-gap">　</p>
      <p class="s-name">ノンノン</p>

      <p class="s-gap">　</p>
      <p class="s-name">兵頭 誠</p>
      <p class="s-line">クソ…もっと面倒なのが来やがった。</p>
      <p class="s-gap">　</p>
      <p class="s-name">ノンノン</p>
      <p class="s-line">それじゃ、楽しくルール説明を始めよう！</p>
      <p class="s-tokagaki">（画面に「GAME RULE」の文字が浮かぶ。）</p>
      <p class="s-name">ノンノン</p>
      <p class="s-line">今回使うのは、さっきみんなに書いてもらったグー・チョキ・パーの三種類のカード！</p>

<script>
(function(){
  'use strict';

  /* ─── Comment content (hardcoded, mock feature — not user editable) ─── */
  var COMMENTS = {
    c1: { author:'獅子王千暁', time:'2026/09/02 10:14', text:'ここで伏見が割って入って自然に喧嘩を終わらせる構成に変更。ゲーム説明に移行したい。' },
    c2: { author:'獅子王千暁', time:'2026/09/02 10:16', text:'この間に場面転換装置用意できる？という意図で追加。不要なら喧嘩シーンごとカット。' },
    c3: { author:'獅子王千暁', time:'2026/09/02 10:22', text:'舞台消灯。投票箱の設置。' },
    c4: { author:'獅子王千暁', time:'2026/09/02 10:28', text:'解説追加' },
    c5: { author:'獅子王千暁', time:'2026/09/05 09:10', text:'嘘。元から█という生き物はこうだった。' },
    c6: { author:'獅子王千暁', time:'2026/09/05 09:12', text:'嘘。三流詐欺師のママとパパを調教してた。あまりにも杜撰だったから。' },
    c7: { author:'獅子王千暁', time:'2026/09/05 09:14', text:'嘘。あの人らにそれは無理。向いてないことを強要するのは酷だ。' },
    c8: { author:'獅子王千暁', time:'2026/09/05 09:16', text:'嘘。戸籍は自分で捨てた。さすがに母さんたちも相当驚いたらしいね。やり方は内緒。話が長くなるから。' },
    c9: { author:'獅子王千暁', time:'2026/09/05 09:16', text:'もっと嘘。橋の下から拾われたらしい。' },
    c10: { author:'獅子王千暁', time:'2026/09/05 09:20', text:'さて。さすがにオチは言わずとも分かるよね？' }
  };

  var REV_ORDER = ['necrogame-v1', 'necrogame-v0', 'necrogame-v2', 'necrogame-v3', 'necrogame-v4'];

  var canvas   = document.getElementById('tlCanvas');
  var spread   = document.getElementById('tlSpread');
  var caption  = document.getElementById('tlCaption');
  var titleEl  = document.getElementById('tlTitle');

  var baseTitle = 'ネクロゲーム_最新版';
  var currentId = null;

  function el(tag, cls){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }

  /* ─── Revision rendering ─── */
  function renderRevision(id){
    var tpl = document.getElementById('rev-' + id);
    if (!tpl) return;

    var src   = tpl.content.cloneNode(true);
    var frag  = document.createDocumentFragment();
    var panels = Array.prototype.slice.call(src.querySelectorAll('[data-panel]')).reverse();

    panels.forEach(function(p){
      var panel = el('section', 'panel');
      var cuts  = el('div', 'panel__cuts');
      if (p.getAttribute('data-min-cols')) {
        cuts.style.setProperty('--min-cols', p.getAttribute('data-min-cols'));
      }

      Array.prototype.slice.call(p.querySelectorAll('[data-cut]')).reverse().forEach(function(c){
        var cut = el('article', 'cut' + (c.hasAttribute('data-cover') ? ' cut--cover' : ''));
        var slot = el('div', 'cut__badge-slot');
        var n = c.getAttribute('data-n');
        if (n) {
          var badge = el('span', 'cut__badge');
          badge.textContent = n;
          slot.appendChild(badge);
        }
        var body = el('div', 'cut__body');
        while (c.firstChild) body.appendChild(c.firstChild);
        cut.appendChild(slot);
        cut.appendChild(body);
        cuts.appendChild(cut);
      });

      panel.appendChild(cuts);
      frag.appendChild(panel);
    });

    spread.replaceChildren(frag);
    currentId = id;
    applyRevisionChrome(tpl.dataset, id);
    buildHistList();
    initTypeReveal();

    requestAnimationFrame(function(){
      canvas.scrollTo({ left: canvas.scrollWidth, top: 0, behavior: 'auto' });
    });
  }

  /* ─── Scroll-triggered typing animation (IME-style: romaji, then conversion) ─── */
  var typeIO = null;
  function initTypeReveal(){
    if (typeIO) typeIO.disconnect();
    var targets = spread.querySelectorAll('.s-type[data-type-chunks]');
    if (!targets.length) return;
    typeIO = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        typeIO.unobserve(entry.target);
        var chunks;
        try { chunks = JSON.parse(entry.target.getAttribute('data-type-chunks')); }
        catch (e) { chunks = null; }
        if (chunks) typeChunks(entry.target, chunks);
      });
    }, { root: canvas, threshold: 0.6 });
    targets.forEach(function(t){ typeIO.observe(t); });
  }

  function jitter(base, spread){
    return base + Math.floor(Math.random() * spread);
  }

  function typeChunks(target, chunks){
    target.textContent = '';
    var settled = '';
    var ci = 0;

    function nextChunk(){
      if (ci >= chunks.length) return;
      var romaji = chunks[ci][0];
      var kana   = chunks[ci][1];

      if (!romaji) {
        settled += kana;
        target.textContent = settled;
        ci++;
        setTimeout(nextChunk, jitter(70, 60));
        return;
      }

      var ri = 0;
      (function typeRomaji(){
        ri++;
        target.textContent = settled + romaji.slice(0, ri);
        if (ri < romaji.length) {
          setTimeout(typeRomaji, jitter(45, 55));
        } else {
          setTimeout(function(){
            settled += kana;
            target.textContent = settled;
            ci++;
            setTimeout(nextChunk, jitter(70, 60));
          }, jitter(120, 100));
        }
      })();
    }
    nextChunk();
  }

  function applyRevisionChrome(ds, id){
    var isCurrent = ds.current === '1';
    titleEl.textContent = isCurrent ? baseTitle : '█████';

    try { location.hash = 'rev=' + id; } catch (e) {}
  }

  function buildHistList(){
    var list = document.getElementById('tlHistList');
    if (!list) return;
    list.innerHTML = '';
    REV_ORDER.forEach(function(id){
      var tpl = document.getElementById('rev-' + id);
      if (!tpl) return;
      var ds = tpl.dataset;
      var btn = el('button', 'tl-hist-item');
      btn.type = 'button';
      if (id === currentId) btn.setAttribute('aria-current', 'true');
      btn.addEventListener('click', function(){
        renderRevision(id);
        closePop(histPop, histBtn);
      });

      var row1 = el('div', 'tl-hist-row1');
      var dot = el('span', 'tl-hist-dot');
      var labelText = ds.date ? (ds.label + '（' + ds.date + '）') : ds.label;
      var label;
      if (ds.glitch === '1') {
        label = el('span', 'tl-hist-glitch');
        label.textContent = labelText;
      } else {
        label = document.createTextNode(labelText);
      }
      row1.appendChild(dot);
      row1.appendChild(label);

      var meta = el('div', 'tl-hist-meta');
      meta.textContent = ds.note || '';

      btn.appendChild(row1);
      btn.appendChild(meta);
      list.appendChild(btn);
    });
  }

  /* ─── Popover (history) ─── */
  function makePopover(btn, pop){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var willOpen = pop.hidden;
      closeAllPops();
      if (willOpen) openPop(pop, btn);
    });
  }
  function openPop(pop, btn){
    pop.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
  }
  function closePop(pop, btn){
    pop.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  var histBtn = document.getElementById('tlHistBtn');
  var histPop = document.getElementById('tlHistPop');

  function closeAllPops(){
    closePop(histPop, histBtn);
  }
  makePopover(histBtn, histPop);
  document.addEventListener('click', function(e){
    if (!e.target.closest('.tl-pop-anchor')) closeAllPops();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeAllPops();
  });

  /* ─── Comment tooltip ─── */
  var tip = document.getElementById('cmtTip');
  var tipList = document.getElementById('cmtTipList');
  var pinned = null;
  var canHover = false;
  try { canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches; } catch (e) {}

  function anchorRect(span){
    var rects = span.getClientRects();
    return (rects && rects.length) ? rects[0] : span.getBoundingClientRect();
  }

  function showTip(span){
    var ids = span.getAttribute('data-cmt').split('|');
    var comments = ids.map(function(id){ return COMMENTS[id]; }).filter(Boolean);
    if (!comments.length) return;

    tipList.innerHTML = '';
    comments.forEach(function(c){
      var item = el('div', 'tip-item');
      var head = el('div', 'tip-head');
      var author = el('span', 'tip-author');
      author.textContent = c.author;
      var time = el('span', 'tip-time');
      time.textContent = c.time;
      head.appendChild(author);
      head.appendChild(time);
      var text = el('div', 'tip-text');
      text.textContent = c.text;
      item.appendChild(head);
      item.appendChild(text);
      tipList.appendChild(item);
    });

    tip.hidden = false;
    tip.style.visibility = 'hidden';
    var r = anchorRect(span);
    var tw = tip.offsetWidth, th = tip.offsetHeight, M = 10;
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;

    var left = r.right + M;
    if (left + tw > vw - M) left = r.left - M - tw;
    if (left < M) left = Math.min(Math.max(M, r.left), Math.max(M, vw - tw - M));

    var top = r.top + r.height / 2 - th / 2;
    top = Math.max(M, Math.min(top, vh - th - M));

    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.visibility = 'visible';
    span.setAttribute('aria-describedby', 'cmtTip');
  }

  function hideTip(){
    tip.hidden = true;
  }

  function unpin(){
    if (pinned) pinned.classList.remove('is-open');
    pinned = null;
    hideTip();
  }

  canvas.addEventListener('mouseover', function(e){
    if (!canHover || pinned) return;
    var s = e.target.closest && e.target.closest('.cmt');
    if (!s) return;
    showTip(s);
  });
  canvas.addEventListener('mouseout', function(e){
    if (!canHover || pinned) return;
    var s = e.target.closest && e.target.closest('.cmt');
    if (!s) return;
    if (e.relatedTarget && s.contains(e.relatedTarget)) return;
    hideTip();
  });
  canvas.addEventListener('click', function(e){
    var s = e.target.closest && e.target.closest('.cmt');
    if (!s) { if (pinned) unpin(); return; }
    if (pinned === s) { unpin(); return; }
    unpin();
    pinned = s;
    s.classList.add('is-open');
    showTip(s);
  });
  canvas.addEventListener('focusin', function(e){
    var s = e.target.closest && e.target.closest('.cmt');
    if (s) showTip(s);
  });
  canvas.addEventListener('focusout', function(){
    if (!pinned) hideTip();
  });
  window.addEventListener('scroll', function(){ unpin(); }, true);
  window.addEventListener('resize', function(){ unpin(); });

  /* ─── Delete-script confirmation (fake/mock — local session only) ─── */
  var deleteModal = document.getElementById('deleteModal');
  var deleteConfirmBtn = document.getElementById('deleteConfirmBtn');

  function openDeleteModal(){ deleteModal.hidden = false; }
  function closeDeleteModal(){ deleteModal.hidden = true; }

  canvas.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('.s-delete-btn')) openDeleteModal();
  });
  deleteModal.addEventListener('click', function(e){
    if (e.target === deleteModal) closeDeleteModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !deleteModal.hidden) closeDeleteModal();
  });
  deleteConfirmBtn.addEventListener('click', function(){
    REV_ORDER = REV_ORDER.filter(function(id){ return id === 'necrogame-v1'; });
    closeDeleteModal();
    closeAllPops();
    renderRevision('necrogame-v1');
  });

  /* ─── Init: read #rev= hash, else current revision ─── */
  function initialRevId(){
    var m = /rev=([\w-]+)/.exec(location.hash || '');
    if (m && document.getElementById('rev-' + m[1])) return m[1];
    var cur = REV_ORDER.filter(function(id){
      var tpl = document.getElementById('rev-' + id);
      return tpl && tpl.dataset.current === '1';
    })[0];
    return cur || REV_ORDER[0];
  }

  renderRevision(initialRevId());
})();
</script>
