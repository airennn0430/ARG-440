<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネクロゲーム_最新版 | TELLASTRY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap');

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   CSS Variables
━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root{
  --tl-teal:       #7fc9b5;
  --tl-teal-deep:  #5aa48f;
  --tl-ink:        #2f3b38;
  --tl-ink-soft:   #5c6b67;
  --tl-ink-dim:    #8b9793;
  --tl-bg:         #f4f2ec;
  --tl-canvas:     #e3efe9;
  --tl-paper:      #fdfbf5;
  --tl-line:       rgba(47,59,56,.18);
  --tl-red:        #d24545;
  --tl-cmt-bg:     rgba(255,205,90,.32);
  --tl-cmt-bg-hi:  rgba(255,186,52,.62);
  --tl-cmt-line:   rgba(178,126,10,.8);
  --radius-sm:     4px;
  --radius-md:     8px;

  --fs:      15px;
  --col-w:   calc(var(--fs) * 2);
  --badge-h: 30px;

  --hdr-h:      56px;
  --canvas-pad: 34px;
  --caption-h:  32px;
  --paper-pad:  30px;

  --page-h: clamp(280px,
    calc(100dvh - var(--hdr-h)
         - var(--canvas-pad) - var(--caption-h) - var(--paper-pad) - var(--badge-h)),
    720px);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Reset & Base
━━━━━━━━━━━━━━━━━━━━━━━━━ */
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--tl-bg);
  color:var(--tl-ink);
  font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
  line-height:1.6;
}
button{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.tl-header{
  position:sticky; top:0; z-index:100;
  height:var(--hdr-h);
  background:var(--tl-teal);
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  padding:0 20px;
  box-shadow:0 1px 0 rgba(0,0,0,.06);
}
.tl-header-title{
  display:flex; align-items:center; gap:6px;
  min-width:0; flex:1 1 auto;
}
.tl-header-title h1{
  min-width:0;
  font-size:15px; font-weight:600;
  color:#1f332c;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tl-header-right{
  display:flex; align-items:center; gap:14px;
  flex-shrink:0;
}
.tl-header-btn{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px;
  background:transparent; border:none; border-radius:var(--radius-sm);
  color:#25423a;
  cursor:pointer;
  transition:background .15s;
}
.tl-header-btn:hover{ background:rgba(255,255,255,.28); }
.tl-userchip{
  display:flex; align-items:center; gap:8px;
  color:#25423a; font-size:13px; font-weight:500;
  cursor:default;
}
.tl-userchip svg{ opacity:.8; flex-shrink:0; }
.tl-userchip .caret{ opacity:.7; }

.tl-edit-btn{
  flex-shrink:0;
  width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; color:#1f332c;
  opacity:.7;
  cursor:default;
}

/* Popover (history) */
.tl-pop-anchor{ position:relative; }
.tl-pop{
  position:absolute; top:calc(100% + 8px); right:0;
  width:260px; max-width:80vw;
  background:#fff; color:var(--tl-ink);
  border:1px solid var(--tl-line); border-radius:var(--radius-md);
  box-shadow:0 8px 28px rgba(20,40,35,.16);
  padding:14px;
  font-size:12.5px; line-height:1.8;
  z-index:120;
}
.tl-pop[hidden]{ display:none; }
.tl-pop h4{ font-size:12px; font-weight:700; margin-bottom:8px; color:var(--tl-teal-deep); }
.tl-hist-list{ display:flex; flex-direction:column; gap:2px; }
.tl-hist-item{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  width:100%; text-align:left;
  background:transparent; border:none; border-radius:var(--radius-sm);
  padding:8px 10px; cursor:pointer;
}
.tl-hist-item:hover{ background:rgba(47,59,56,.06); }
.tl-hist-item[aria-current="true"]{ background:rgba(127,201,181,.18); }
.tl-hist-row1{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
.tl-hist-dot{ width:6px; height:6px; border-radius:50%; background:var(--tl-teal-deep); flex-shrink:0; }
.tl-hist-item[aria-current="true"] .tl-hist-row1::after{ content:'現在表示中'; margin-left:auto; font-size:10px; font-weight:500; color:var(--tl-teal-deep); }
.tl-hist-meta{ font-size:11px; color:var(--tl-ink-dim); padding-left:12px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Revision banner
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.tl-revbanner{
  display:flex; align-items:center; justify-content:center; gap:12px;
  flex-wrap:wrap;
  padding:8px 16px;
  background:#fbeecd; color:#7a5a12;
  font-size:12px;
  border-top:1px solid #f0d99a; border-bottom:1px solid #f0d99a;
}
.tl-revbanner[hidden]{ display:none; }
.tl-revbanner-back{
  background:#7a5a12; color:#fff; border:none; border-radius:14px;
  padding:4px 14px; font-size:11.5px; font-weight:600; cursor:pointer;
}
.tl-revbanner-back:hover{ opacity:.88; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Script canvas
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.canvas{
  flex:1 1 auto; min-height:0;
  overflow-x:auto; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  touch-action:pan-x pan-y;
  background:var(--tl-canvas);
  padding:calc(var(--canvas-pad) / 2) 20px;
  display:flex; flex-direction:column;
}
.canvas::-webkit-scrollbar{ height:10px; }
.canvas::-webkit-scrollbar-track{ background:transparent; }
.canvas::-webkit-scrollbar-thumb{ background:rgba(47,59,56,.25); border-radius:5px; }

.page{
  width:max-content; min-width:100%;
  margin:auto 0;
}
.spread{
  display:flex; flex-direction:row; flex-wrap:nowrap;
  align-items:flex-start; justify-content:center;
  gap:26px;
}
.panel{
  flex:0 0 auto;
  background:var(--tl-paper);
  border-radius:2px;
  padding:14px 18px 16px;
  box-shadow:0 2px 10px rgba(20,60,50,.10), 0 0 0 1px rgba(20,60,50,.05);
}
.panel__cuts{
  display:flex; flex-direction:row; flex-wrap:nowrap; align-items:stretch;
  width:max-content;
  justify-content:flex-end;
  background-repeat:no-repeat, no-repeat;
  background-position:right bottom, right bottom;
  background-image:
    linear-gradient(to bottom, var(--tl-line) 0 1px, transparent 1px),
    repeating-linear-gradient(to left, var(--tl-line) 0 1px, transparent 1px var(--col-w));
  background-size:
    100% calc(var(--page-h) + 1px),
    100% var(--page-h);
  min-width:calc(var(--col-w) * 6);
}

.cut{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; }
.cut__badge-slot{
  height:var(--badge-h);
  display:flex; align-items:flex-start; justify-content:flex-end;
  padding-top:2px;
}
.cut__badge{
  width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--tl-ink-dim);
  border-radius:2px;
  font-family:'Outfit', sans-serif;
  font-size:12px; font-weight:600;
  color:var(--tl-ink-soft);
  background:var(--tl-paper);
}
.cut__body{
  writing-mode:vertical-rl; -webkit-writing-mode:vertical-rl;
  text-orientation:mixed; -webkit-text-orientation:mixed;
  height:var(--page-h);
  box-sizing:border-box;
  padding:10px 0 6px;
  font-size:var(--fs);
  line-height:var(--col-w);
  letter-spacing:.02em;
  color:var(--tl-ink);
  line-break:strict;
  word-break:normal;
  overflow-wrap:normal;
}
.cut__body > p{ margin:0; }

.s-hashira{ font-weight:600; }
.s-tokagaki{ padding-inline-start:1em; color:var(--tl-ink-soft); }
.s-cue{
  padding-inline-start:var(--col-w);
  text-indent:calc(var(--col-w) * -1);
}
.s-name{ font-weight:500; }
.s-line{ }
.s-line-cont{ padding-inline-start:var(--col-w); }
.s-gap{ color:transparent; }

.s-cover-title{ font-weight:700; letter-spacing:.06em; }
.s-cover-sub{ padding-inline-start:.4em; color:var(--tl-ink-soft); }
.s-cover-date{ padding-inline-start:.4em; color:var(--tl-ink-dim); font-size:calc(var(--fs) * .92); }
.s-cover-author{ padding-inline-start:.4em; color:var(--tl-ink-dim); font-size:calc(var(--fs) * .92); }
.tcy{ text-combine-upright:all; -webkit-text-combine:horizontal; }

.page-caption{
  writing-mode:horizontal-tb;
  text-align:center;
  font-family:'Outfit', sans-serif;
  font-size:12px; letter-spacing:.12em;
  color:var(--tl-ink-dim);
  padding:calc(var(--caption-h) / 2) 0;
}

/* Comment marker */
.cmt{
  background-color:var(--tl-cmt-bg);
  text-decoration:underline dotted 1px;
  text-decoration-color:var(--tl-cmt-line);
  text-underline-offset:3px;
  border-radius:2px;
  cursor:help;
}
.cmt:hover, .cmt:focus-visible, .cmt.is-open{
  background-color:var(--tl-cmt-bg-hi);
  outline:none;
}

/* Old-revision visual stamp */
body.is-past .panel{ filter:sepia(.14) saturate(.9); position:relative; }
body.is-past .panel::after{
  content:'旧版';
  position:absolute; top:8px; left:8px;
  writing-mode:horizontal-tb;
  font-size:10px; font-weight:700; letter-spacing:.08em;
  color:#a06b1a; background:rgba(255,255,255,.85);
  border:1px solid rgba(160,107,26,.4);
  border-radius:3px; padding:2px 6px;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   Comment tooltip (fixed, outside canvas)
━━━━━━━━━━━━━━━━━━━━━━━━━ */
.cmt-tip{
  position:fixed; z-index:200;
  writing-mode:horizontal-tb;
  width:230px; max-width:70vw;
  background:#2f3b38; color:#f2f6f4;
  border-radius:var(--radius-md);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  padding:10px 12px;
  font-size:12px; line-height:1.7;
  visibility:hidden;
}
.cmt-tip[hidden]{ display:none; }
.cmt-tip .tip-head{ display:flex; align-items:baseline; gap:6px; margin-bottom:4px; }
.cmt-tip .tip-author{ font-weight:700; font-size:12px; color:#bfe6da; }
.cmt-tip .tip-time{ font-size:10px; color:#93a39d; }
.cmt-tip .tip-text{ color:#eef3f1; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━
   RESPONSIVE — chrome only, never the tategaki structure
━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media (max-width:720px){
  :root{
    --hdr-h:50px;
    --canvas-pad:24px; --caption-h:26px; --paper-pad:22px;
  }
  .tl-header{ padding:0 12px; gap:8px; }
  .tl-header-title h1{ font-size:12.5px; }
  .tl-header-right{ gap:6px; }
  .tl-userchip .tl-username{ display:none; }
  .tl-header-btn{ width:32px; height:32px; }
  .spread{ gap:16px; }
  .panel{ padding:10px 12px 14px; }
}
</style>
<link rel="stylesheet" href="../shared/anime-redact.css">
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="tl-header">
  <div class="tl-header-title">
    <h1 id="tlTitle">ネクロゲーム_最新版</h1>
    <button type="button" class="tl-edit-btn" aria-disabled="true" tabindex="-1" aria-label="タイトルを編集（プレビュー版では無効）">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>
  </div>
  <div class="tl-header-right">
    <div class="tl-userchip" aria-label="ログインユーザー">
      <span class="tl-username">小泉徳宏</span>
      <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div class="tl-pop-anchor">
      <button type="button" class="tl-header-btn" id="tlHistBtn" aria-haspopup="true" aria-expanded="false" title="編集履歴を見る" aria-label="編集履歴を見る">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 7 12 12 15.5 14"/>
        </svg>
      </button>
      <div class="tl-pop" id="tlHistPop" role="dialog" aria-label="編集履歴" hidden>
        <h4>編集履歴</h4>
        <div class="tl-hist-list" id="tlHistList"></div>
      </div>
    </div>
  </div>
</header>

<!-- ═══ REVISION BANNER ═══ -->
<div class="tl-revbanner" id="tlRevBanner" role="status" hidden>
  <span id="tlRevBannerText"></span>
  <button type="button" class="tl-revbanner-back" id="tlRevBackBtn">最新版に戻る</button>
</div>

<!-- ═══ SCRIPT CANVAS ═══ -->
<div class="canvas" id="tlCanvas">
  <div class="page">
    <div class="spread" id="tlSpread"></div>
    <p class="page-caption" id="tlCaption">-1-</p>
  </div>
</div>

<!-- Comment tooltip -->
<div class="cmt-tip" id="cmtTip" role="tooltip" hidden>
  <div class="tip-head">
    <span class="tip-author"></span>
    <span class="tip-time"></span>
  </div>
  <div class="tip-text"></div>
</div>

<!-- ═══ REVISION SOURCE TEMPLATES (fake / hardcoded — swapped by JS only) ═══ -->

<!-- 最新版 -->
<template id="rev-necrogame-v1" data-label="最新版" data-date="2026/9/2" data-author="獅子王千暁" data-note="最新台本" data-current="1">
  <section data-panel data-min-cols="9">
    <article data-cut>
      <p class="s-cue"><span class="s-name">伏見 瀬人</span><span class="s-line">　こういうのはさ、まず状況整理から始めなきゃ。</span></p>
      <p class="s-tokagaki"><span class="cmt" data-cmt="c1" tabindex="0" role="button" aria-haspopup="true">(伏見、朝倉と兵頭の間に割って入る)</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">朝倉 陽介</span><span class="s-line">　邪魔するな！だいたい、全部お前のせいで…！</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">伏見 瀬人</span><span class="s-line">　邪魔ァ？お前の方が進行の邪魔なンだよ。オレの楽しみを奪うなよな。</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">朝倉 陽介</span><span class="s-line">　人が死んでるんだぞ！何だよその態度！</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">伏見 瀬人</span><span class="s-line">　じゃ、葬式の用意をしないとなァ。</span></p>
      <p class="s-line-cont"><span class="cmt" data-cmt="c2" tabindex="0" role="button" aria-haspopup="true">…待てよ？棺桶の用意が無ェ。</span>やっぱ葬式は無しだ。</p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">兵頭 誠</span><span class="s-line">　伏見！あんま調子に乗ってると……</span></p>
      <p class="s-tokagaki">（兵頭、伏見に掴みかかるものの、伏見はそのままマイクを持って発言位置へ。）</p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">伏見 瀬人</span><span class="s-line">　さて、話を進めようか。今回のゲームは3種類のカードを使うらしい。みんな持ってる？</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　はーい！　もちろん持ってるよォ！</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">朝倉 陽介</span><span class="s-line">　……誰だ？</span></p>
      <p class="s-tokagaki"><span class="cmt" data-cmt="c3" tabindex="0" role="button" aria-haspopup="true">（正面の大型モニターが点灯する。）</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　お待たせしましたぁ！ゲームの説明なら、このボクにお任せ！</span></p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　ボクは今回のゲームを担当する、かわいいマスコットのノンノンだよ！</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">茂部 永太</span><span class="s-line">　自分でマスコットって言うんだ。</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　言うよォ！　だってマスコットだもん！</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">兵頭 誠</span><span class="s-line">　クソ…もっと面倒なのが来やがった。</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　それじゃ、楽しくルール説明を始めよう！</span></p>
      <p class="s-tokagaki">（画面に「GAME RULE」の文字が浮かぶ。）</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　今回使うのは、さっきみんなに書いてもらったグー・チョキ・パーの三種類のカード！</span></p>
      <p class="s-tokagaki">（グー、チョキ、パーのカードが画面に並ぶ。）</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　まず、ここにいる16人のみんなには、ゲーム開始前にカードを5枚ずつ書いてもらいました！</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">朝倉 陽介</span><span class="s-line">　……自分で書いたカードを使うのか？</span></p>
      <p class="s-gap">　</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　ところがどっこい！</span></p>
      <p class="s-tokagaki">（画面のカードが一斉にシャッフルされる。）</p>
      <p class="s-cue"><span class="s-name">ノンノン</span><span class="s-line">　みんなのカードは、ぜーんぶ混ぜ混ぜ！</span></p>
      <p class="s-tokagaki">（シャッフル音。）</p>

<script>
(function(){
  'use strict';

  /* ─── Comment content (hardcoded, mock feature — not user editable) ─── */
  var COMMENTS = {
    c1: { author:'獅子王千暁', time:'2026/09/02 10:14', text:'ここで伏見が割って入って自然に喧嘩を終わらせる構成に変更。ゲーム説明に移行したい。' },
    c2: { author:'獅子王千暁', time:'2026/09/02 10:16', text:'この間に場面転換装置用意できる？という意図で追加。不要なら喧嘩シーンごとカット。' },
    c3: { author:'獅子王千暁', time:'2026/09/02 10:22', text:'舞台消灯。投票箱の設置。' }
  };

  var REV_ORDER = ['necrogame-v1'];

  var canvas   = document.getElementById('tlCanvas');
  var spread   = document.getElementById('tlSpread');
  var caption  = document.getElementById('tlCaption');
  var titleEl  = document.getElementById('tlTitle');
  var banner   = document.getElementById('tlRevBanner');
  var bannerTx = document.getElementById('tlRevBannerText');
  var backBtn  = document.getElementById('tlRevBackBtn');

  var baseTitle = 'ネクロゲーム_最新版';
  var currentId = null;

  function el(tag, cls){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }

  /* ─── Revision rendering ─── */
  function renderRevision(id){
    var tpl = document.getElementById('rev-' + id);
    if (!tpl) return;

    var src   = tpl.content.cloneNode(true);
    var frag  = document.createDocumentFragment();
    var panels = Array.prototype.slice.call(src.querySelectorAll('[data-panel]')).reverse();

    panels.forEach(function(p){
      var panel = el('section', 'panel');
      var cuts  = el('div', 'panel__cuts');
      if (p.getAttribute('data-min-cols')) {
        cuts.style.setProperty('--min-cols', p.getAttribute('data-min-cols'));
      }

      Array.prototype.slice.call(p.querySelectorAll('[data-cut]')).reverse().forEach(function(c){
        var cut = el('article', 'cut' + (c.hasAttribute('data-cover') ? ' cut--cover' : ''));
        var slot = el('div', 'cut__badge-slot');
        var n = c.getAttribute('data-n');
        if (n) {
          var badge = el('span', 'cut__badge');
          badge.textContent = n;
          slot.appendChild(badge);
        }
        var body = el('div', 'cut__body');
        while (c.firstChild) body.appendChild(c.firstChild);
        cut.appendChild(slot);
        cut.appendChild(body);
        cuts.appendChild(cut);
      });

      panel.appendChild(cuts);
      frag.appendChild(panel);
    });

    spread.replaceChildren(frag);
    currentId = id;
    applyRevisionChrome(tpl.dataset, id);
    buildHistList();

    requestAnimationFrame(function(){
      canvas.scrollTo({ left: canvas.scrollWidth, top: 0, behavior: 'auto' });
    });
  }

  function applyRevisionChrome(ds, id){
    var isCurrent = ds.current === '1';
    titleEl.textContent = isCurrent ? baseTitle : baseTitle + '（' + ds.label + '）';

    document.body.classList.toggle('is-past', !isCurrent);

    if (isCurrent) {
      banner.hidden = true;
    } else {
      bannerTx.textContent = '旧版を表示中：' + ds.label + '（' + ds.date + '）　' + (ds.note || '');
      banner.hidden = false;
    }

    try { location.hash = 'rev=' + id; } catch (e) {}
  }

  function buildHistList(){
    var list = document.getElementById('tlHistList');
    if (!list) return;
    list.innerHTML = '';
    REV_ORDER.forEach(function(id){
      var tpl = document.getElementById('rev-' + id);
      if (!tpl) return;
      var ds = tpl.dataset;
      var btn = el('button', 'tl-hist-item');
      btn.type = 'button';
      if (id === currentId) btn.setAttribute('aria-current', 'true');
      btn.addEventListener('click', function(){
        renderRevision(id);
        closePop(histPop, histBtn);
      });

      var row1 = el('div', 'tl-hist-row1');
      var dot = el('span', 'tl-hist-dot');
      var label = document.createTextNode(ds.label + '（' + ds.date + '）');
      row1.appendChild(dot);
      row1.appendChild(label);

      var meta = el('div', 'tl-hist-meta');
      meta.textContent = ds.note || '';

      btn.appendChild(row1);
      btn.appendChild(meta);
      list.appendChild(btn);
    });
  }

  backBtn.addEventListener('click', function(){
    var cur = REV_ORDER.filter(function(id){
      var tpl = document.getElementById('rev-' + id);
      return tpl && tpl.dataset.current === '1';
    })[0];
    if (cur) renderRevision(cur);
  });

  /* ─── Popover (history) ─── */
  function makePopover(btn, pop){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var willOpen = pop.hidden;
      closeAllPops();
      if (willOpen) openPop(pop, btn);
    });
  }
  function openPop(pop, btn){
    pop.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
  }
  function closePop(pop, btn){
    pop.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  var histBtn = document.getElementById('tlHistBtn');
  var histPop = document.getElementById('tlHistPop');

  function closeAllPops(){
    closePop(histPop, histBtn);
  }
  makePopover(histBtn, histPop);
  document.addEventListener('click', function(e){
    if (!e.target.closest('.tl-pop-anchor')) closeAllPops();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeAllPops();
  });

  /* ─── Comment tooltip ─── */
  var tip = document.getElementById('cmtTip');
  var tipAuthor = tip.querySelector('.tip-author');
  var tipTime   = tip.querySelector('.tip-time');
  var tipText   = tip.querySelector('.tip-text');
  var pinned = null;
  var canHover = false;
  try { canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches; } catch (e) {}

  function anchorRect(span){
    var rects = span.getClientRects();
    return (rects && rects.length) ? rects[0] : span.getBoundingClientRect();
  }

  function showTip(span){
    var c = COMMENTS[span.getAttribute('data-cmt')];
    if (!c) return;
    tipAuthor.textContent = c.author;
    tipTime.textContent = c.time;
    tipText.textContent = c.text;

    tip.hidden = false;
    tip.style.visibility = 'hidden';
    var r = anchorRect(span);
    var tw = tip.offsetWidth, th = tip.offsetHeight, M = 10;
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;

    var left = r.right + M;
    if (left + tw > vw - M) left = r.left - M - tw;
    if (left < M) left = Math.min(Math.max(M, r.left), Math.max(M, vw - tw - M));

    var top = r.top + r.height / 2 - th / 2;
    top = Math.max(M, Math.min(top, vh - th - M));

    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.style.visibility = 'visible';
    span.setAttribute('aria-describedby', 'cmtTip');
  }

  function hideTip(){
    tip.hidden = true;
  }

  function unpin(){
    if (pinned) pinned.classList.remove('is-open');
    pinned = null;
    hideTip();
  }

  canvas.addEventListener('mouseover', function(e){
    if (!canHover || pinned) return;
    var s = e.target.closest && e.target.closest('.cmt');
    if (!s) return;
    showTip(s);
  });
  canvas.addEventListener('mouseout', function(e){
    if (!canHover || pinned) return;
    var s = e.target.closest && e.target.closest('.cmt');
    if (!s) return;
    if (e.relatedTarget && s.contains(e.relatedTarget)) return;
    hideTip();
  });
  canvas.addEventListener('click', function(e){
    var s = e.target.closest && e.target.closest('.cmt');
    if (!s) { if (pinned) unpin(); return; }
    if (pinned === s) { unpin(); return; }
    unpin();
    pinned = s;
    s.classList.add('is-open');
    showTip(s);
  });
  canvas.addEventListener('focusin', function(e){
    var s = e.target.closest && e.target.closest('.cmt');
    if (s) showTip(s);
  });
  canvas.addEventListener('focusout', function(){
    if (!pinned) hideTip();
  });
  window.addEventListener('scroll', function(){ unpin(); }, true);
  window.addEventListener('resize', function(){ unpin(); });

  /* ─── Init: read #rev= hash, else current revision ─── */
  function initialRevId(){
    var m = /rev=([\w-]+)/.exec(location.hash || '');
    if (m && document.getElementById('rev-' + m[1])) return m[1];
    var cur = REV_ORDER.filter(function(id){
      var tpl = document.getElementById('rev-' + id);
      return tpl && tpl.dataset.current === '1';
    })[0];
    return cur || REV_ORDER[0];
  }

  renderRevision(initialRevId());
})();
</script>
